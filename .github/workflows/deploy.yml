name: Deploy

on:
  push:
    branches: [main]
  # The app's release workflow fires this, so a new version rebuilds the download page and the
  # changelog without anybody touching this repository.
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Lifts the anonymous rate limit on the release and changelog reads the build makes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
      # Tells Bing, and the answer engines that read its index, about the new pages at once rather
      # than waiting to be crawled. It reads the sitemap that is now live, so it submits what was
      # actually published; a failure must never fail a deploy that already succeeded.
      - name: Submit URLs to IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs
